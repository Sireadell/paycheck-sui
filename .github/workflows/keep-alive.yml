name: Keep the live app awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health route until 21 Nov 2026
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261121 ]; then echo "Past 21 Nov, nothing to do."; exit 0; fi
          curl -fsS -m 90 --retry 2 https://paycheck-sui-app.onrender.com/health
